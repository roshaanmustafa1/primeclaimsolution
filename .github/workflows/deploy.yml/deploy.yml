name: Deploy to WHM production
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install and build
        run: |
          npm install
          npm run build
      - name: Copy build to WHM
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.WHM_HOST }}
          username: ${{ secrets.WHM_USER }}
          key: ${{ secrets.WHM_SSH_KEY }}
          port: ${{ secrets.WHM_PORT }}
          source: "package.json,server.js,public,.next"
          target: "/home/primeclaimsoluti/primeclaimsolution"
          strip_components: 0
      - name: Install deps and restart app
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.WHM_HOST }}
          username: ${{ secrets.WHM_USER }}
          key: ${{ secrets.WHM_SSH_KEY }}
          port: ${{ secrets.WHM_PORT }}
          script: |
            cd /home/primeclaimsoluti/primeclaimsolution
            source /home/primeclaimsoluti/nodevenv/primeclaimsolution/20/bin/activate
            npm install --omit=dev
            pkill -f "next-server" || true
            pkill -f "node server.js" || true
            sleep 2
            mkdir -p tmp
            touch tmp/restart.txt
            sleep 8
            curl -s -o /dev/null -w "homepage: %{http_code}\n" https://primeclaimsolution.com/
